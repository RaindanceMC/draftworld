# This module's wording. Every line can be rewritten in plugins/RainsCore/messages.yml.
draftworld:
  entered: "<green>You are in the draft world. <gray>Your own things wait outside; <white>/draftworld</white> takes you back."
  left: "<green>Back where you were, with your own things."
  not-allowed: "<red>Only builders can go into the draft world."
  leave-admin-mode-first: "<red>Leave admin mode first (<white>/admin</white>), then go into the draft world."
  no-world: "<red>The draft world <white><world></white> is not loaded right now."
  only-a-player: "<red>Only a player can go into the draft world."
  not-inside: "<gray>You are not in the draft world. <white>/draftworld</white> takes you in."
  usage: "<gray>/draftworld <dark_gray>— in, or back out · <gray>/draftworld back <dark_gray>— back to where you were"
  command-refused: "<red>/<command> does not work in the draft world. <gray><white>/draftworld</white> takes you back out."
  admin-refused: "<red>Admin mode cannot be switched in the draft world. Leave it first with <white>/draftworld</white>."
  game-mode-refused: "<red>You cannot be in <white><mode></white> mode in the draft world."
  portal-refused: "<red>Portals do not lead anywhere from the draft world."
  file-broken: "<red>Your saved draft world things cannot be read, so nothing was swapped. Ask staff to look at it."
  could-not-save: "<red>Your things could not be saved, so nothing was swapped. Try again in a moment."
  unreadable: "<red>Some of your saved things cannot be read right now, so you stay as you are. Ask staff to look at it."
  taken-in: "<gray>You are in the draft world, so your own things are put away until you leave it."
  brought-out: "<gray>You have your own things back from the draft world."
  sent-out: "<red>You may not be in the draft world, so you have been sent back."
